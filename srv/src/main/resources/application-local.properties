# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:kasistocks;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Load the CAP-generated schema on startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql

# CAP mock authentication
cds.security.authentication.mode=mock

# Mock users
cds.security.mock.users[0].name=alice
cds.security.mock.users[0].password=alice
cds.security.mock.users[0].roles[0]=IntegrationProcessor
cds.security.mock.users[0].roles[1]=Viewer
cds.security.mock.users[0].roles[2]=Manager

cds.security.mock.users[1].name=bob
cds.security.mock.users[1].password=bob
cds.security.mock.users[1].roles[0]=Viewer

cds.security.mock.users[2].name=carol
cds.security.mock.users[2].password=carol
cds.security.mock.users[2].roles[0]=Viewer

# H2 console — inspect tables at localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true
