_schema-version: 3.3.0
ID: kasistocks-reorders
version: 1.0.0-SNAPSHOT
description: KasiStocks CAP Java Integration Service

parameters:
  enable-parallel-deployments: true

modules:
  - name: kasistocks-reorders-srv
    type: java
    path: srv
    parameters:
      instances: 1
      buildpack: sap_java_buildpack_jakarta
    properties:
      SPRING_PROFILES_ACTIVE: cloud
      JBP_CONFIG_COMPONENTS: "jres: ['com.sap.xs.java.buildpack.jre.SAPMachineJRE']"
      JBP_CONFIG_SAP_MACHINE_JRE: '{ version: 21.+ }'
    build-parameters:
      builder: custom
      commands:
        - mvn clean package -DskipTests=true --batch-mode
      build-result: target/*-exec.jar
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: kasistocks-reorders-auth
      - name: kasistocks-reorders-db
      - name: kasistocks-reorders-ans

  - name: kasistocks-reorders-db-deployer
    type: hdb
    path: db
    parameters:
      buildpack: nodejs_buildpack
    build-parameters:
      builder: custom
      commands:
        - npm run build
    requires:
      - name: kasistocks-reorders-db

resources:
  - name: kasistocks-reorders-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: kasistocks-reorders
        tenant-mode: dedicated

  - name: kasistocks-reorders-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: kasistocks-reorders-ans
    type: org.cloudfoundry.managed-service
    parameters:
      service: alert-notification
      service-plan: standard
